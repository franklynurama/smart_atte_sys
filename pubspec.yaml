name: smart_atte_sys
description: Raspberry Pi Smart Attendance System (Clean Architecture + Riverpod).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  file_picker: ^8.0.5
  csv: ^5.1.1
  excel: ^4.0.6

  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.15.2
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.0

  path_provider: ^2.1.4
  http: ^1.2.2
  web: ^1.1.0

  # Used only for demonstrating encryption/decryption placeholders.
  # The app remains functional even if you later replace this with a real algorithm.
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/course_files/course_list.xlsx

